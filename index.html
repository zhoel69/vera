<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>
Selagi Untuk Kebutuhan Keluarga, Istri Bekerja Tak Apa 😇
</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;

  touch-action:none;
  overscroll-behavior:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  padding:20px;
}

/* Background glow */
.bg{
  position:absolute;
  width:500px;
  height:500px;
  background:
  radial-gradient(circle,
  rgba(255,255,255,0.15),
  transparent 70%);

  animation:bgFloat 6s ease-in-out infinite;
}

@keyframes bgFloat{
  0%{
    transform:scale(1) translateY(0);
  }
  50%{
    transform:scale(1.1) translateY(-20px);
  }
  100%{
    transform:scale(1) translateY(0);
  }
}

.container{
  width:100%;
  max-width:900px;
  position:relative;
  z-index:2;
}

.title{
  color:#fff;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:20px;

  text-shadow:0 0 15px rgba(255,255,255,0.3);

  animation:fadeIn 1s ease;
}

.title span{
  display:block;
  font-size:14px;
  opacity:0.8;
  margin-top:8px;
  font-weight:normal;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.video-box{
  width:100%;
  border-radius:24px;
  overflow:hidden;
  position:relative;

  box-shadow:
  0 0 25px rgba(255,255,255,0.12),
  0 0 60px rgba(255,255,255,0.06);

  animation:videoFloat 4s ease-in-out infinite;
}

@keyframes videoFloat{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.015);
  }
  100%{
    transform:scale(1);
  }
}

video{
  width:100%;
  height:auto;
  display:block;
  background:#000;
}

.protect{
  position:fixed;
  inset:0;
  z-index:9999;
}
</style>
</head>

<body
oncontextmenu="return false"
oncopy="return false"
oncut="return false"
onpaste="return false"
ondragstart="return false"
onselectstart="return false"
>

<div class="bg"></div>

<div class="container">

  <div class="title">
    Selagi Untuk Kebutuhan Keluarga,<br>
    Istri Bekerja Tak Apa 😇

    <span>
      Yang penting tetap bisa mengatur,
      mengurus anak dan suami • IRT Produktif
    </span>
  </div>

  <div class="video-box">

    <!-- GANTI NAMA VIDEO DI SINI -->
    <video id="video" autoplay loop playsinline controls>
      <source src="video.mp4" type="video/mp4">
    </video>

  </div>
</div>

<div class="protect"></div>

<script>
const video = document.getElementById('video');

/* Aktifkan suara setelah disentuh */
document.body.addEventListener('click', () => {
  video.muted = false;
  video.play();
});

/* Blok zoom */
document.addEventListener('gesturestart', function(e){
  e.preventDefault();
});

/* Blok shortcut */
document.addEventListener('keydown', function(e){

  if(
    (e.ctrlKey &&
    ['+','-','=','u','c','x','v','s','a']
    .includes(e.key.toLowerCase()))
    ||
    e.key === 'F12'
  ){
    e.preventDefault();
  }

});

/* Anti inspect */
document.onkeydown = function(e){

  if(e.keyCode == 123){
    return false;
  }

  if(
    e.ctrlKey &&
    e.shiftKey &&
    ['I','J','C'].includes(e.key.toUpperCase())
  ){
    return false;
  }
};

/* Blok double tap zoom */
let lastTouchEnd = 0;

document.addEventListener('touchend', function(event){

  const now = (new Date()).getTime();

  if(now - lastTouchEnd <= 300){
    event.preventDefault();
  }

  lastTouchEnd = now;

}, false);
</script>

</body>
</html>
